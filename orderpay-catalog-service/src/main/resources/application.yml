server:
  port: 8081

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderpay_catalog
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 16
        format_sql: true
        generate_statistics: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

#springdoc:
#  swagger-ui:
#    enabled: false

app:
  aop:
    slow-threshold-ms: 150

logging:
  level:
    com.deepan.orderpay.catalog.aop: DEBUG